version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel8-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - laravel-net
        depends_on:
            - db

    nginx:
        image: nginx:alpine
        container_name: laravel8-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel-net
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: laravel8-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
        ports:
            - "3310:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel-net

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laravel8-phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_USER: laravel
            PMA_PASSWORD: laravel
        networks:
            - laravel-net

networks:
    laravel-net:
        driver: bridge

volumes:
    dbdata:
